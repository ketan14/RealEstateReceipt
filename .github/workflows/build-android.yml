name: build-android
on:
  push:
    branches: [ feature/tier2 ]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android

      - name: Install tar/unzip/curl
        run: |
          sudo apt-get update
          sudo apt-get install -y tar unzip curl

      - name: Add Android SDK to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK Command-line Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip sdk.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          yes | sdkmanager \
            "platforms;android-33" \
            "ndk;25.2.9519653"

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli

      - name: Install Node dependencies
        run: npm ci

      - name: Init Tauri Android project
        run: npm run tauri android init

      - name: Build Tauri Android
        run: npm run tauri android build
