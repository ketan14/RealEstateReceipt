name: build-android

on:
  push:
    branches: [ feature/tier2 ]

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK & NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "ndk;25.2.9519653" "build-tools;33.0.2"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Init Tauri Android project
        run: npm run tauri android init

      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Build Tauri Android App
        run: npm run tauri android build --target aarch64

      - name: Upload Output Artifacts (APK)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/